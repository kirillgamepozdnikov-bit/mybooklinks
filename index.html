<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Specter Xpath — Гул пустых коридоров</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Underdog&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4eedf;--ink:#141414;--wc:#ffd23f;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;position:relative}

/* ===== фон: точки, фигуры, облака ===== */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(20,20,20,.22) 1.6px,transparent 1.8px);background-size:26px 26px;animation:dots 8s linear infinite}
@keyframes dots{to{background-position:26px 26px}}
.deco{position:fixed;z-index:0;pointer-events:none;border:3px solid var(--ink)}
.d1{width:clamp(44px,7vw,84px);aspect-ratio:1;border-radius:50%;background:#ff6b6b;left:5%;top:14%;animation:fl1 7s ease-in-out infinite}
.d2{width:clamp(38px,6vw,70px);aspect-ratio:1;background:#4ecdc4;right:6%;bottom:20%;border-radius:10px;animation:spin 14s linear infinite}
.d3{width:clamp(50px,8vw,96px);aspect-ratio:1;border-radius:50%;border-style:dashed;right:9%;top:16%;animation:spin 20s linear infinite reverse}
.d4{width:clamp(30px,4vw,50px);aspect-ratio:1;background:#a78bfa;left:8%;bottom:18%;border-radius:50% 0 50% 0;animation:fl1 9s ease-in-out infinite reverse}
@keyframes fl1{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(12deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;left:-300px;top:var(--y);width:var(--w);animation:cdrift var(--t) linear infinite}
@keyframes cdrift{to{transform:translateX(calc(100vw + 340px))}}
.cloud svg{display:block;width:100%;height:auto;filter:drop-shadow(4px 4px 0 rgba(20,20,20,.18));animation:cbob 5s ease-in-out infinite alternate}
@keyframes cbob{to{transform:translateY(-12px)}}

main{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:clamp(28px,6vh,64px) 18px calc(80px + env(safe-area-inset-bottom,0px))}

/* ===== приветствие ===== */
.welcome{display:flex;align-items:center;gap:14px;height:clamp(60px,9vw,88px);padding:0 clamp(16px,3vw,28px) 0 12px;
  background:var(--wc);border:3px solid var(--ink);border-radius:999px;box-shadow:6px 6px 0 var(--ink);
  transition:background-color .5s;animation:wob 5s ease-in-out infinite;max-width:100%}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(1.6deg) translateY(-4px)}}
.tag{flex:none;background:var(--ink);color:var(--bg);font-weight:800;font-size:12px;letter-spacing:.12em;padding:7px 11px;border-radius:999px}
.wtxt{font-family:'Underdog',serif;font-size:clamp(24px,5.4vw,50px);white-space:nowrap;line-height:1.1}

/* анимация букв (приветствие и заголовок) */
.ch{display:inline-block;animation:var(--in) .7s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:var(--d)}
.fx0{--in:chA}.fx1{--in:chB}.fx2{--in:chC}
@keyframes chA{from{opacity:0;transform:translateY(40px) rotate(14deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes chB{from{opacity:0;transform:perspective(300px) rotateX(-90deg) translateY(-14px)}to{opacity:1;transform:none}}
@keyframes chC{from{opacity:0;filter:blur(10px);transform:translateX(-26px) skewX(-20deg)}to{opacity:1;filter:none;transform:none}}
.out .ch{animation:chOut .45s ease-in both;animation-delay:var(--dd,0ms)}
@keyframes chOut{to{opacity:0;transform:translateY(-34px) rotate(-10deg) scale(.6)}}

/* ===== заголовок ===== */
.tbox{display:flex;align-items:center;justify-content:center;width:100%;margin-top:clamp(18px,3.5vh,34px);min-height:calc(2.1*clamp(36px,8.2vw,100px))}
h1{font-family:'Underdog',serif;font-weight:400;text-align:center;line-height:1.02;font-size:clamp(36px,8.2vw,100px);white-space:nowrap;animation:fade .8s .1s both}
h1.long{font-size:clamp(28px,6vw,78px)}
h1 mark{background:none;color:inherit;position:relative;z-index:0}
h1 mark::after{content:"";position:absolute;z-index:-1;left:-.06em;right:-.06em;bottom:.06em;height:.34em;background:var(--wc);transition:background-color .5s;transform:rotate(-1.2deg)}
.hint{margin:clamp(14px,2.4vh,24px) 0 clamp(24px,4vh,38px);min-height:1.4em;text-align:center;font-weight:700;font-size:clamp(12px,1.8vw,14px);letter-spacing:.25em;text-transform:uppercase;opacity:.65;transition:opacity .4s;animation:fade .8s .25s both}
.hint.off{opacity:0}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ===== флаги ===== */
.flags{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.4vw,26px);width:min(840px,100%)}
@media (max-width:640px){.flags{grid-template-columns:repeat(2,minmax(0,1fr))}}
a.f{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 12px 18px;background:var(--c);border:3px solid var(--ink);border-radius:18px;
  box-shadow:6px 6px 0 var(--ink);color:var(--ink);text-decoration:none;transform:rotate(var(--r));
  transition:transform .18s,box-shadow .18s;animation:rise .6s cubic-bezier(.2,.9,.3,1.3) backwards;animation-delay:calc(var(--i)*.08s + .4s)}
@keyframes rise{from{opacity:0;transform:translateY(46px) rotate(calc(var(--r)*4)) scale(.88)}}
a.f:hover,a.f:focus-visible{transform:translate(-3px,-3px) rotate(0);box-shadow:10px 10px 0 var(--ink);outline:none}
a.f:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
a.f:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
a.f .fl{width:clamp(66px,11vw,92px);border:3px solid var(--ink);border-radius:8px;overflow:hidden;box-shadow:3px 3px 0 var(--ink);transition:transform .3s cubic-bezier(.2,.9,.3,1.5);animation:flagw 4s ease-in-out infinite;animation-delay:calc(var(--i)*-.6s)}
@keyframes flagw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
a.f:hover .fl{animation:none;transform:rotate(-5deg) scale(1.08)}
a.f .fl svg{display:block;width:100%;height:auto}
a.f .nm{font-family:'Underdog',serif;font-size:clamp(19px,2.6vw,26px);text-align:center}
a.f .pl{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 13px;font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
a.f .ar{position:absolute;top:8px;right:12px;font-weight:800;font-size:20px;transition:transform .2s}
a.f:hover .ar{transform:translate(3px,-3px)}

.sig{position:fixed;z-index:3;left:0;right:0;bottom:0;padding:16px 0 calc(14px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;
  font-weight:800;font-size:12px;letter-spacing:.45em;text-transform:uppercase;color:rgba(20,20,20,.55);background:linear-gradient(to top,var(--bg) 40%,transparent)}

/* ===== котики ===== */
.cat{position:fixed;left:0;top:0;width:84px;height:60px;z-index:50;pointer-events:none;will-change:transform;transform-origin:50% 50%}
.cat .flip{position:relative;display:block;width:84px;height:60px}
.cat svg{width:84px;height:60px;display:block;overflow:visible;transform-origin:28px 57px;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.fur{fill:var(--fur)}.fur2{fill:var(--fur2)}.belly{fill:var(--belly)}.furS{stroke:var(--fur)}.stripe{stroke:var(--stripe)}
.cat .leg{transform-box:fill-box;transform-origin:50% 5%}
.cat .tail{transform-box:fill-box;transform-origin:100% 100%;animation:tail 2s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
.cat.run .tail{animation-duration:.4s}
.cat.run .la{animation:legA var(--sp,.4s) linear infinite}
.cat.run .lb{animation:legB var(--sp,.4s) linear infinite}
@keyframes legA{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(38deg)}}
@keyframes legB{0%,100%{transform:rotate(38deg)}50%{transform:rotate(-38deg)}}
.cat .bob{transform-box:fill-box}
.cat.run .bob{animation:hop var(--sp,.4s) ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.cat .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.cat .ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 5s infinite}
@keyframes ear{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-12deg)}}
.cat.sleep .eye{animation:none;transform:scaleY(.1)}
.cat.sleep .tail{animation-duration:4s}
.cat.sleep .bob{transform:translateY(6px)}
.zz{position:absolute;left:50%;top:-6px;display:none;font-family:'Underdog',serif;color:var(--ink)}
.cat.sleep .zz{display:block}
.zz i{position:absolute;font-style:normal;opacity:0;animation:zz 2.4s ease-in-out infinite}
.zz i:nth-child(2){animation-delay:.8s}.zz i:nth-child(3){animation-delay:1.6s}
@keyframes zz{0%{opacity:0;transform:translate(0,8px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-26px) scale(1.3)}}
/* «!» перед дракой */
.bang{position:absolute;left:66%;top:-20px;width:21px;height:21px;border-radius:50%;background:#ff6b6b;border:2.5px solid var(--ink);color:#fff;font:800 13px/16px 'Inter',sans-serif;text-align:center;display:none}
.cat.alert .bang{display:block;animation:bangpop .35s cubic-bezier(.2,.9,.3,1.6)}
@keyframes bangpop{from{transform:scale(0) rotate(-40deg)}}
/* звёздочки вокруг головы после драки */
.dz{position:absolute;left:84%;top:8px;width:0;height:0;display:none}
.cat.dizzy .dz{display:block}
.dz i{position:absolute;left:-7px;top:-9px;font-style:normal;font-size:15px;color:#ffd23f;text-shadow:-1px -1px 0 #141414,1px -1px 0 #141414,-1px 1px 0 #141414,1px 1px 0 #141414;animation:orbit 1s linear infinite}
.dz i:nth-child(2){animation-delay:-.33s}.dz i:nth-child(3){animation-delay:-.66s}
@keyframes orbit{from{transform:rotate(0) translateX(17px) scaleY(.45) rotate(0)}to{transform:rotate(360deg) translateX(17px) scaleY(.45) rotate(-360deg)}}
.cat.dizzy .bob{animation:sway .5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
/* вылизывает лапу */
.cat.lick .lf{animation:lick .38s ease-in-out infinite alternate}
@keyframes lick{from{transform:rotate(-112deg)}to{transform:rotate(-134deg)}}
.cat.lick .bob{animation:lickbob .76s ease-in-out infinite alternate}
@keyframes lickbob{from{transform:translateY(2px) rotate(1deg)}to{transform:translateY(3px) rotate(-3deg)}}
.cat.lick .eye{animation:none;transform:scaleY(.22)}
/* кувырок под себя: котик сворачивается в клубок */
.cat.tumble .tail{animation-duration:.3s}
.cat.tumble .leg{animation:none;transform:rotate(80deg)}
.cat.tumble .bob{transform:scale(.86)}
/* боевая стойка на задних лапах (как на фото) */
.cat.stand svg{transform:translate(10px,-5px) rotate(-48deg)}
.cat.stand .hd{animation:none;transform:rotate(48deg)}
/* лбами друг к другу */
.cat .head{transform-box:fill-box;transform-origin:15% 90%}
.cat.stand .head{animation:headbutt .55s ease-in-out infinite alternate}
@keyframes headbutt{from{transform:rotate(12deg)}to{transform:rotate(24deg)}}
/* злая морда */
.brow,.snarl{display:none}
.cat.angry .brow,.cat.angry .snarl{display:inline}
.cat.angry .mouth{display:none}
.cat.angry .eye{animation:none;transform:scaleY(.6)}
/* ругательства-«запикано» в облачках */
.sb{position:absolute;background:#fff;border:3px solid #141414;border-radius:16px;padding:5px 11px;font:800 clamp(14px,2vw,18px)/1.1 'Inter',sans-serif;color:#d1242f;letter-spacing:.08em;white-space:nowrap;box-shadow:3px 3px 0 #141414;transform-origin:50% 100%;animation:sb 1.55s cubic-bezier(.2,.9,.3,1.4) forwards}
.sb::after{content:"";position:absolute;left:var(--tl,50%);bottom:-10px;width:13px;height:13px;background:#fff;border-right:3px solid #141414;border-bottom:3px solid #141414;transform:translateX(-50%) rotate(45deg)}
@keyframes sb{0%{opacity:0;transform:translate(-50%,-100%) scale(.2) rotate(var(--br))}14%{opacity:1;transform:translate(-50%,-100%) scale(1.15) rotate(var(--br))}24%{transform:translate(-50%,-100%) scale(1) rotate(var(--br))}85%{opacity:1;transform:translate(-50%,-108%) scale(1) rotate(var(--br))}100%{opacity:0;transform:translate(-50%,-125%) scale(.95) rotate(var(--br))}}
.cat.stand .sh{opacity:0}
.cat.stand .bob{animation:boxbob .35s ease-in-out infinite alternate}
@keyframes boxbob{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-2px) rotate(1.5deg)}}
.cat.stand .fr{animation:punch .42s ease-in-out infinite alternate}
.cat.stand .fr.lf{animation-delay:-.21s}
@keyframes punch{from{transform:rotate(-18deg)}to{transform:rotate(-62deg)}}

/* ===== драка в облаке ===== */
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.brawl{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;display:none}
.brawl.on{display:block;animation:shake .09s linear infinite}
@keyframes shake{0%{transform:translate(3px,-2px)}25%{transform:translate(-3px,3px)}50%{transform:translate(2px,3px)}75%{transform:translate(-3px,-2px)}100%{transform:translate(3px,-2px)}}
.brawl svg{width:100%;height:100%;overflow:visible;display:block}
.brawl .cl{transform-origin:0 0;animation:tumble .5s linear infinite}
@keyframes tumble{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.08)}100%{transform:rotate(360deg) scale(1)}}
.star{position:absolute;font-size:calc(22px*var(--s,1));line-height:1;color:var(--c,#ffd23f);text-shadow:-1.5px -1.5px 0 #141414,1.5px -1.5px 0 #141414,-1.5px 1.5px 0 #141414,1.5px 1.5px 0 #141414;animation:starfly .9s ease-out forwards}
@keyframes starfly{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}70%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1)}}
.puff{position:absolute;width:var(--sz);height:var(--sz);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 30%,rgba(190,196,208,.55) 58%,rgba(190,196,208,0) 74%);animation:puff 1.1s ease-out forwards}
@keyframes puff{from{opacity:.95;transform:translate(-50%,-50%) scale(.3)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.8)}}
.ppaw,.ptail{position:absolute;background:var(--c);border:3px solid #141414;transform-origin:0 50%;animation:poke .5s ease-out forwards}
.ppaw{width:26px;height:20px;margin-top:-10px;border-radius:50% 60% 60% 50%}
.ptail{width:44px;height:11px;margin-top:-5px;border-radius:8px}
@keyframes poke{0%{opacity:0;transform:rotate(var(--a)) translateX(10px) scale(.4)}35%{opacity:1;transform:rotate(var(--a)) translateX(64px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateX(20px) scale(.5)}}
.bw{position:absolute;font-family:'Underdog',serif;font-size:calc(34px*var(--s,1));color:var(--c,#ffd23f);-webkit-text-stroke:2px #141414;paint-order:stroke fill;text-shadow:3px 3px 0 #141414;white-space:nowrap;animation:bw .95s cubic-bezier(.2,.9,.3,1.4) forwards}
@keyframes bw{0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(.1)}25%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1.15)}75%{opacity:1;transform:translate(-50%,-62%) rotate(var(--r)) scale(1)}100%{opacity:0;transform:translate(-50%,-115%) rotate(var(--r)) scale(1)}}
.ring{position:absolute;width:60px;height:60px;border:5px solid #141414;border-radius:50%;animation:ring .6s ease-out forwards}
@keyframes ring{from{opacity:1;transform:translate(-50%,-50%) scale(.3)}to{opacity:0;transform:translate(-50%,-50%) scale(4)}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="deco d1"></div><div class="deco d2"></div><div class="deco d3"></div><div class="deco d4"></div>
<div id="sky" aria-hidden="true"></div>

<main>
  <div class="welcome" aria-live="polite"><span class="tag" id="tag">RU</span><span class="wtxt" id="wtxt"></span></div>
  <div class="tbox"><h1 id="title"><span id="t1">Гул пустых</span><br><mark id="t2">коридоров</mark></h1></div>
  <div class="hint" id="hint">Нажми на свой флаг</div>

  <nav class="flags">
    <a class="f" style="--i:0;--c:#ffd23f;--r:-1.4deg" href="https://booknet.ua/book/gul-porozhnh-koridorv-b461080" target="_blank" rel="noopener" lang="uk">
      <span class="ar">↗</span>
      <div class="fl"><svg viewBox="0 0 30 20"><rect width="30" height="10" fill="#0057b7"/><rect y="10" width="30" height="10" fill="#ffd700"/></svg></div>
      <div class="nm">Українська</div><div class="pl">Booknet</div></a>
    <a class="f" style="--i:1;--c:#8ecae6;--r:1deg" href="https://www.litres.ru/book/specter-xpath/gul-pustyh-koridorov-71415493/" target="_blank" rel="noopener" lang="ru">
      <span class="ar">↗</span>
      <div class="fl"><svg viewBox="0 0 30 20"><rect width="30" height="7" fill="#fff"/><rect y="7" width="30" height="6.5" fill="#0039a6"/><rect y="13.5" width="30" height="6.5" fill="#d52b1e"/></svg></div>
      <div class="nm">Русский</div><div class="pl">ЛитРес</div></a>
    <a class="f" style="--i:2;--c:#ffb86b;--r:-.8deg" href="https://bookrix.com/de/books/das-drohnen-leerer-korridore-069cijhu" target="_blank" rel="noopener" lang="de">
      <span class="ar">↗</span>
      <div class="fl"><svg viewBox="0 0 30 20"><rect width="30" height="7" fill="#111"/><rect y="7" width="30" height="6.5" fill="#dd0000"/><rect y="13.5" width="30" height="6.5" fill="#ffce00"/></svg></div>
      <div class="nm">Deutsch</div><div class="pl">BookRix</div></a>
    <a class="f" style="--i:3;--c:#ff9ebd;--r:1.2deg" href="https://www.inkitt.com/stories/1924115" target="_blank" rel="noopener" lang="en">
      <span class="ar">↗</span>
      <div class="fl"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="1.6"/><path d="M15 0V20M0 10H30" stroke="#fff" stroke-width="6"/><path d="M15 0V20M0 10H30" stroke="#c8102e" stroke-width="3.6"/></svg></div>
      <div class="nm">English</div><div class="pl">Inkitt</div></a>
    <a class="f" style="--i:4;--c:#b8f2c6;--r:-1deg" href="https://ncode.syosetu.com/n3583mx/" target="_blank" rel="noopener" lang="ja">
      <span class="ar">↗</span>
      <div class="fl"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><circle cx="15" cy="10" r="6" fill="#bc002d"/></svg></div>
      <div class="nm">日本語</div><div class="pl">Syosetu</div></a>
    <a class="f" style="--i:5;--c:#c3b1ff;--r:1.5deg" href="https://www.wattpad.com/story/417870161-boş-koridorların-uğultusu" target="_blank" rel="noopener" lang="tr">
      <span class="ar">↗</span>
      <div class="fl"><svg viewBox="0 0 30 20"><rect width="30" height="20" fill="#e30a17"/><circle cx="11.5" cy="10" r="5" fill="#fff"/><circle cx="12.8" cy="10" r="4" fill="#e30a17"/><polygon fill="#fff" points="17,7.6 17.59,9.19 19.28,9.26 17.95,10.31 18.41,11.94 17,11 15.59,11.94 16.05,10.31 14.72,9.26 16.41,9.19" transform="translate(2.2 0)"/></svg></div>
      <div class="nm">Türkçe</div><div class="pl">Wattpad</div></a>
  </nav>
</main>
<div class="sig">Specter Xpath</div>

<div id="fx" aria-hidden="true"><div class="brawl" id="brawl"><svg viewBox="-80 -80 160 160"><g class="cl" id="cl"></g></svg></div></div>

<template id="catT">
<div class="cat" aria-hidden="true">
  <div class="flip">
    <svg viewBox="0 0 112 80" stroke="#141414" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <ellipse class="sh" cx="56" cy="77" rx="32" ry="3" fill="rgba(0,0,0,.25)" stroke="none"/>
      <g class="tail"><path d="M22 46 Q-2 42 6 16 Q9 10 14 14 Q10 30 28 38" fill="none" stroke="#141414" stroke-width="13"/><path class="furS" d="M22 46 Q-2 42 6 16 Q9 10 14 14 Q10 30 28 38" fill="none" stroke-width="6"/></g>
      <g class="leg la hd"><rect class="fur2" x="26" y="56" width="8" height="19" rx="4"/></g>
      <g class="leg lb fr"><rect class="fur2" x="68" y="56" width="8" height="19" rx="4"/></g>
      <g class="bob">
        <ellipse class="fur" cx="50" cy="48" rx="34" ry="17"/>
        <path class="stripe" d="M30 34 Q34 44 30 58 M44 31 Q48 44 44 63 M58 31 Q62 44 58 64" stroke-width="3" fill="none"/>
        <ellipse class="belly" cx="52" cy="58" rx="21" ry="7" stroke="none"/>
        <g class="head"><g class="ear"><path class="fur" d="M78 28 L81 10 L92 22 Z"/><path d="M81 24 L82.5 16 L88 22 Z" fill="#ff9db8" stroke="none"/></g>
        <path class="fur" d="M96 22 L106 12 L108 28 Z"/><path d="M99 24 L105 18 L105.5 26 Z" fill="#ff9db8" stroke="none"/>
        <ellipse class="fur" cx="94" cy="36" rx="18" ry="15"/>
        <ellipse class="belly" cx="100" cy="42" rx="9" ry="7" stroke="none"/>
        <g class="eye"><ellipse cx="88" cy="33" rx="3.2" ry="4.4" fill="#141414" stroke="none"/><circle cx="89" cy="31.5" r="1.3" fill="#fff" stroke="none"/></g>
        <g class="eye"><ellipse cx="103" cy="33" rx="3.2" ry="4.4" fill="#141414" stroke="none"/><circle cx="104" cy="31.5" r="1.3" fill="#fff" stroke="none"/></g>
        <path d="M98 39 L101.5 39 L99.7 42 Z" fill="#ff6f8f" stroke-width="1.5"/>
        <path class="mouth" d="M99.7 42 Q97 46 94 44 M99.7 42 Q102 46 105 44" fill="none" stroke-width="1.6"/>
        <g class="snarl"><path d="M92.5 44.5 Q99.7 41.5 107 44.5 Q105 50.5 99.7 50.5 Q94.5 50.5 92.5 44.5 Z" fill="#8b1c2b" stroke-width="2"/><path d="M95 45 L96.6 49 L98.2 45.2 Z M101.4 45.2 L103 49 L104.6 45 Z" fill="#fff" stroke="none"/></g>
        <path d="M108 40 L117 38 M108 43 L117 45 M90 41 L81 39 M90 44 L81 46" fill="none" stroke-width="1.2" opacity=".6"/>
        <path class="brow" d="M81 25.5 L93 31" fill="none" stroke-width="3.2"/><path class="brow" d="M98 31 L109.5 25.5" fill="none" stroke-width="3.2"/></g>
      </g>
      <g class="leg lb hd"><rect class="fur" x="34" y="58" width="9" height="19" rx="4.5"/></g>
      <g class="leg la lf fr"><rect class="fur" x="76" y="56" width="9" height="21" rx="4.5"/></g>
    </svg>
    <div class="dz"><i>★</i><i>★</i><i>★</i></div>
    <div class="bang">!</div>
  </div>
  <div class="zz"><i>z</i><i>z</i><i>Z</i></div>
</div>
</template>

<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ID=s=>document.getElementById(s);

/* ---------- облака ---------- */
(function(){
  const sky=ID('sky'),CP="M45 85 Q10 85 10 62 Q10 42 32 40 Q34 18 62 18 Q78 6 98 18 Q120 4 142 22 Q172 20 176 46 Q196 50 192 68 Q188 85 160 85 Z";
  for(let i=0;i<8;i++){
    const w=rnd(110,250),t=rnd(70,140),c=document.createElement('div');c.className='cloud';
    c.style.cssText=`--y:${rnd(2,88).toFixed(1)}%;--w:${w.toFixed(0)}px;--t:${t.toFixed(0)}s;animation-delay:${(-rnd(0,t)).toFixed(1)}s;opacity:${rnd(.75,1).toFixed(2)}`;
    c.innerHTML=`<svg viewBox="0 0 200 100"><path d="${CP}" fill="#fff" stroke="#141414" stroke-width="4" stroke-linejoin="round"/><path d="M52 66 Q66 58 82 66 M120 62 Q134 54 150 62" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" opacity=".25"/></svg>`;
    sky.appendChild(c);
  }
})();

/* ---------- анимация букв ---------- */
function fill(el,t,fx,step,off=0){
  el.classList.remove('out','fx0','fx1','fx2');el.classList.add('fx'+fx);el.textContent='';
  const whole=/[\u0590-\u08FF\u0900-\u097F\u0E00-\u0E7F]/.test(t); // арабский, иврит, хинди, тайский — целым словом
  const parts=whole?[t]:Array.from(t);
  parts.forEach((c,k)=>{const s=document.createElement('span');s.className='ch';s.textContent=c===' '?'\u00a0':c;
    s.style.setProperty('--d',(off+k*step)+'ms');s.style.setProperty('--dd',(k*step*.5)+'ms');el.appendChild(s)});
  return parts.length;
}

/* ---------- подсказка ---------- */
const HT=["Нажми на свой флаг","Натисни на свій прапор","Klick auf deine Flagge","Click your flag","あなたの国旗をクリック","Bayrağına tıkla"];
const hint=ID('hint');let hi=0;
setInterval(()=>{hint.classList.add('off');setTimeout(()=>{hi=(hi+1)%HT.length;hint.textContent=HT[hi];hint.classList.remove('off')},420)},3300);

/* ---------- «Добро пожаловать» ---------- */
const WL=[["Добро пожаловать","RU","#ffd23f"],["Ласкаво просимо","UA","#7bd88f"],["Willkommen","DE","#ffb86b"],["Welcome","EN","#ff9ebd"],["ようこそ","JA","#c3b1ff"],["Hoş geldiniz","TR","#ff6b6b"],
["Bienvenue","FR","#4ecdc4"],["Bienvenido","ES","#ffd23f"],["Benvenuto","IT","#7bd88f"],["欢迎光临","ZH","#ff6b6b"],["환영합니다","KO","#8ecae6"],["Witaj","PL","#ffb86b"],["مرحباً","AR","#c3b1ff"],["Bem-vindo","PT","#ff9ebd"],["Καλώς ήρθατε","EL","#8ecae6"],["Välkommen","SV","#ffd23f"],["स्वागत है","HI","#7bd88f"],["ברוכים הבאים","HE","#ffb86b"],["Welkom","NL","#4ecdc4"],["Tervetuloa","FI","#c3b1ff"]];
const wtxt=ID('wtxt'),tag=ID('tag');let wi=0;
function showW(){
  const [t,code,col]=WL[wi];
  document.documentElement.style.setProperty('--wc',col);tag.textContent=code;
  fill(wtxt,t,wi%3,45);
  setTimeout(()=>wtxt.classList.add('out'),2900);
  setTimeout(()=>{wi=(wi+1)%WL.length;showW()},3500);
}
showW();

/* ---------- название книги на разных языках ---------- */
const TT=[["Гул пустых","коридоров"],["Гул порожніх","коридорів"],["Das Dröhnen","leerer Korridore"],["The Hum of","Empty Corridors"],["空っぽの廊下の","唸り"],["Boş Koridorların","Uğultusu"]];
const title=ID('title'),t1=ID('t1'),t2=ID('t2');let ti=0;
function showT(){
  const [a,b]=TT[ti];title.classList.toggle('long',Math.max(a.length,b.length)>12);
  const fx=(ti+1)%3,n=fill(t1,a,fx,30);fill(t2,b,fx,30,n*30+80);
  setTimeout(()=>{t1.classList.add('out');t2.classList.add('out')},4300);
  setTimeout(()=>{ti=(ti+1)%TT.length;showT()},4950);
}
setTimeout(showT,2500);

/* ---------- эффекты драки ---------- */
const fxL=ID('fx'),brawl=ID('brawl');
(function(){ // облако драки: сначала чёрный контур, сверху белая заливка
  const C=[[0,0,34],[-34,-12,26],[32,-16,27],[-26,26,25],[30,28,26],[0,-38,24],[-46,12,20],[48,10,20],[2,44,22],[-12,-24,26],[18,0,28]];
  let h='';C.forEach(([x,y,r])=>h+=`<circle cx="${x}" cy="${y}" r="${r+3.5}" fill="#141414"/>`);
  C.forEach(([x,y,r])=>h+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/>`);
  h+=`<path d="M-24 -6 q10 -18 26 -6 M10 14 q16 -4 22 10 M-30 22 q8 10 20 4" fill="none" stroke="#b9bec9" stroke-width="3.5" stroke-linecap="round"/>`;
  ID('cl').innerHTML=h;
})();
function mk(cls,txt,x,y,vars,life){
  const e=document.createElement('div');e.className=cls;if(txt)e.textContent=txt;e.style.left=x+'px';e.style.top=y+'px';
  for(const k in vars)e.style.setProperty(k,vars[k]);
  fxL.appendChild(e);setTimeout(()=>e.remove(),life||1300);return e;
}
function star(x,y,big){
  const a=rnd(0,6.283),d=big?rnd(130,270):rnd(60,150);
  mk('star',pick(['★','✦','★','✧']),x,y,{'--dx':Math.cos(a)*d+'px','--dy':Math.sin(a)*d+'px','--rot':rnd(-540,540)+'deg','--s':rnd(.8,big?2:1.6),'--c':pick(['#ffd23f','#ffd23f','#fff','#ff6b6b','#4ecdc4'])},1000);
}
function puff(x,y){mk('puff','',x,y,{'--sz':rnd(50,110)+'px','--dx':rnd(-110,110)+'px','--dy':rnd(-90,60)+'px'},1200)}
function poke(x,y,col){mk(Math.random()<.7?'ppaw':'ptail','',x,y,{'--a':rnd(0,360)+'deg','--c':col},600)}
function word(x,y,t){mk('bw',t||pick(["БАМ!","ТЫЩ!","МЯУ!","ПАФ!","ШМЯК!","BAM!","ФРРР!","ДЫЩ!","POW!","ЦАП!","МЯЯУ!"]),x+rnd(-60,60),y+rnd(-100,-40),{'--r':rnd(-18,18)+'deg','--s':rnd(.9,1.4),'--c':pick(['#ffd23f','#ff9ebd','#8ecae6','#b8f2c6'])},1100)}
function ring(x,y){mk('ring','',x,y,{},700)}
const CURSE=["#@%&*!","*!@#$%","@#$%&*!!","%*#@!","&$#@%*!","*****!","@#&%!!","#$%*@&!"];
function bubble(x,y,tl){mk('sb',pick(CURSE),x,y,{'--br':rnd(-5,5)+'deg','--tl':(tl||50)+'%'},1700)}
function dust(x,y){for(let i=0;i<3;i++)mk('puff','',x+rnd(-14,14),y+rnd(-6,2),{'--sz':rnd(26,42)+'px','--dx':rnd(-40,40)+'px','--dy':rnd(-22,-4)+'px'},900)}

/* ---------- котики ---------- */
let W=innerWidth,H=innerHeight;addEventListener('resize',()=>{W=innerWidth;H=innerHeight});
const T=ID('catT');
function makeCatEl(theme){const el=T.content.firstElementChild.cloneNode(true);for(const k in theme)el.style.setProperty(k,theme[k]);document.body.appendChild(el);return el}
let fight=null;
class Cat{
  constructor(el,x,y,col,canFlip){this.el=el;this.flip=el.querySelector('.flip');this.col=col;this.canFlip=!!canFlip;this.after=null;Object.assign(this,{x,y,tx:x,ty:y,hx:x,dir:1,state:'sit',until:performance.now()+rnd(600,2000),rot:0,faceDir:1});this.cls()}
  cls(){const s=this.state,c=this.el.classList;c.toggle('run',s==='walk'||s==='run'||s==='go'||s==='spin');c.toggle('sleep',s==='sleep');c.toggle('dizzy',s==='dizzy');c.toggle('lick',s==='lick');c.toggle('tumble',s==='flip')}
  hide(v){this.el.style.visibility=v?'hidden':''}
  pickTarget(){for(let i=0;i<10;i++){this.tx=rnd(50,W-50);this.ty=rnd(Math.min(130,H*.3),H-14);if(Math.hypot(this.tx-this.x,this.ty-this.y)>140)break}}
  next(now){
    if(this.state==='walk'||this.state==='run'){
      // дошёл до цели: либо особое действие, либо отдых
      if(this.after){const a=this.after;this.after=null;this.act(a,now);return}
      const r=Math.random();
      if(r<.26){this.state='sleep';this.until=now+rnd(4500,8500)}
      else if(r<.6){this.state='lick';this.until=now+rnd(2400,4600)}
      else{this.state='sit';this.until=now+rnd(1400,3800)}
    }else{
      // отдохнул: выбираем, куда и зачем идти
      const r=Math.random();
      if(r<.22){this.tx=rnd(Math.min(130,W*.5),Math.max(W-60,W*.5));this.ty=rnd(Math.min(150,H*.3),H-30);this.after='spin'}
      else{this.pickTarget();this.after=(r<.42&&this.canFlip)?'flip':null}
      this.state=Math.random()<.25?'run':'walk';
      this.el.style.setProperty('--sp',(this.state==='run'?.28:.55)+'s');
    }
    this.cls();
  }
  act(a,now){
    this.t0=now;
    if(a==='spin'){this.state='spin';this.sdur=rnd(2400,3600);this.cx=this.x-38;this.cy=this.y;this.el.style.setProperty('--sp','.26s')}
    else{this.state='flip';this.n=Math.random()<.4?2:1;this.fy0=this.y;this.fx0=this.x;this.fd=this.x<W/2?1:-1;this.dir=this.fd}
    this.cls();
  }
  go(tx,ty,face){this.tx=tx;this.ty=ty;this.faceDir=face;this.after=null;this.rot=0;this.state='go';this.el.style.setProperty('--sp','.28s');this.cls()}
  hold(){this.state='hold';this.dir=this.faceDir;this.cls();this.el.classList.add('stand','angry')}
  fly(now,tgt,spin){this.fx0=this.x;this.fy0=this.y;this.vx=(tgt-this.x)/.8;this.spin=spin;this.t0=now;this.dir=tgt<this.x?-1:1;this.state='fly';this.cls()}
  update(now,dt){
    const s=this.state;
    if(s==='walk'||s==='run'||s==='go'){
      const sp=s==='go'?160:s==='run'?180:65,dx=this.tx-this.x,dy=this.ty-this.y,d=Math.hypot(dx,dy),st=sp*dt;
      if(d<=st){this.x=this.tx;this.y=this.ty;if(s==='go')this.hold();else this.next(now)}
      else{this.x+=dx/d*st;this.y+=dy/d*st;if(Math.abs(dx)>3)this.dir=dx>0?1:-1}
    }else if(s==='fly'){
      const t=(now-this.t0)/1000;
      if(t>=.8){this.x=this.fx0+this.vx*.8;this.y=this.fy0;this.rot=0;this.state='dizzy';this.until=now+2400;this.cls()}
      else{this.x=this.fx0+this.vx*t;this.y=this.fy0-520*t+650*t*t;this.rot=this.spin*360*(t/.8)}
    }else if(s==='dizzy'){
      if(now>this.until){this.state='sit';this.until=now+rnd(700,1400);this.cls()}
    }else if(s==='hold'){ // в стойке: подступает вплотную к сопернику
      this.x+=(this.hx-this.x)*Math.min(1,dt*2.2);
    }else if(s==='spin'){ // гоняется за своим хвостом: бежит по маленькому кругу
      const t=(now-this.t0)/1000;
      if(t>=this.sdur){this.state='sit';this.until=now+rnd(800,1500);this.cls()}
      else{const p=t*5.2;this.x=this.cx+38*Math.cos(p);this.y=this.cy+13*Math.sin(p);this.dir=Math.sin(p)<0?1:-1}
    }else if(s==='flip'){ // кувырок вперёд (1–2 раза)
      const t=(now-this.t0)/1000,T=.8*this.n;
      if(t>=T){this.y=this.fy0;this.rot=0;dust(this.x,this.y-4);this.state='sit';this.until=now+rnd(700,1400);this.cls()}
      else{const p=(t/.8)%1;this.y=this.fy0-88*p*(1-p);this.rot=this.fd*360*p;this.x=this.fx0+this.fd*70*(t/.8)}
    }else if(s==='sit'||s==='sleep'||s==='lick'){
      if(now>this.until)this.next(now);
    }
  }
  draw(){
    this.x=Math.max(40,Math.min(W-40,this.x));this.y=Math.max(40,Math.min(H-6,this.y));
    this.el.style.transform=`translate(${this.x-42}px,${this.y-57}px) rotate(${this.rot}deg)`;
    this.flip.style.transform=`scaleX(${this.dir})`;
  }
}
const cA=new Cat(makeCatEl({'--fur':'#f2a043','--fur2':'#c97a25','--stripe':'#c9741a','--belly':'#ffe6c0'}),rnd(80,W*.4),H-30,'#f2a043',true);
const cB=new Cat(makeCatEl({'--fur':'#4b505e','--fur2':'#343845','--stripe':'#2a2d38','--belly':'#d9dce4'}),rnd(W*.6,W-80),H*.62,'#4b505e',false);
cB.dir=-1;
const cats=[cA,cB];

/* ---------- драка раз в минуту ---------- */
let nextFight=performance.now()+14000;
function startFight(now){
  const mx=Math.max(120,Math.min(W-120,rnd(W*.25,W*.75)));
  const my=Math.min(H-34,rnd(Math.max(190,H*.45),H-34));
  const [a,b]=cA.x<=cB.x?[cA,cB]:[cB,cA];
  a.go(mx-62,my,1);b.go(mx+62,my,-1);a.hx=mx-22;b.hx=mx+22;
  fight={ph:'gather',t0:now,mx,my,a,b,until:0};
}
function fightStep(now){
  const f=fight,cx=f.mx,cy=f.my-26;
  if(f.ph==='gather'){
    if((f.a.state==='hold'&&f.b.state==='hold')||now-f.t0>12000){
      [f.a,f.b].forEach(c=>{if(c.state!=='hold'){c.x=c.tx;c.y=c.ty;c.hold()}});
      f.ph='face';f.until=now+2700;f.nb=now+350;
    }
  }else if(f.ph==='face'){
    if(now>=f.nb&&f.until-now>700){f.nb=now+1100;bubble(cx-62,f.my-92,78);bubble(cx+62,f.my-92,22)}
    if(now>=f.until){
      [f.a,f.b].forEach(c=>{c.hide(true);c.el.classList.remove('alert','stand','angry')});
      brawl.style.left=cx+'px';brawl.style.top=cy+'px';brawl.classList.add('on');
      f.ph='brawl';f.until=now+3300;f.n={poke:0,star:0,word:0,puff:0,bub:0,side:1};ring(cx,cy);
    }
  }else if(f.ph==='brawl'){
    const n=f.n;
    if(now>=n.puff){n.puff=now+90;puff(cx+rnd(-30,30),cy+rnd(-30,30))}
    if(now>=n.poke){n.poke=now+140;poke(cx,cy,pick([f.a.col,f.b.col]))}
    if(now>=n.star){n.star=now+110;star(cx,cy);star(cx,cy)}
    if(now>=n.word){n.word=now+420;word(cx,cy)}
    if(now>=n.bub){n.bub=now+620;n.side*=-1;bubble(cx+n.side*rnd(75,105),cy-rnd(65,100),n.side<0?80:20)}
    if(now>=f.until){
      brawl.classList.remove('on');
      ring(cx,cy);word(cx,cy,'ПУФ!');for(let i=0;i<12;i++)star(cx,cy,true);for(let i=0;i<6;i++)puff(cx+rnd(-40,40),cy+rnd(-30,30));
      [f.a,f.b].forEach(c=>c.hide(false));
      f.a.fly(now,Math.max(50,f.a.x-rnd(170,270)),-pick([2,3]));
      f.b.fly(now,Math.min(W-50,f.b.x+rnd(170,270)),pick([2,3]));
      f.ph='after';
    }
  }else if(f.ph==='after'){
    const busy=c=>c.state==='fly'||c.state==='dizzy';
    if(!busy(f.a)&&!busy(f.b)){fight=null;nextFight=Math.max(now+6000,f.t0+30000)}
  }
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!RM){
    if(!fight&&now>=nextFight)startFight(now);
    cats.forEach(c=>c.update(now,dt));
    if(fight)fightStep(now);
  }
  cats.forEach(c=>c.draw());
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
